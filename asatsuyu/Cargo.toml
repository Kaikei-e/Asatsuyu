[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kaikei/asatsuyu"

[workspace.dependencies]
# Internal crates
asatsuyu-syntax         = { path = "crates/asatsuyu-syntax" }
asatsuyu-lexer          = { path = "crates/asatsuyu-lexer" }
asatsuyu-parser         = { path = "crates/asatsuyu-parser" }
asatsuyu-ast            = { path = "crates/asatsuyu-ast" }
asatsuyu-hir            = { path = "crates/asatsuyu-hir" }
asatsuyu-ty             = { path = "crates/asatsuyu-ty" }
asatsuyu-backend-python = { path = "crates/asatsuyu-backend-python" }
asatsuyu-runtime-python = { path = "crates/asatsuyu-runtime-python" }

# Lexer
logos = "0.16"

# CST (lossless syntax tree)
rowan = "0.16"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Diagnostics
miette = { version = "7.6", features = ["fancy"] }

# String interning
smol_str = "0.3"

# Arena allocation
la-arena = "0.3"

# PyO3 (runtime crate only)
pyo3 = { version = "0.29" }

# Serialization (CLI JSON diagnostic output)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Project config
toml = "1.1"

# PEP 440 version specifier parsing (CLI only)
pep440_rs = "0.7"

# File watching (CLI only)
notify = "8.2"
notify-debouncer-mini = "0.7"

# Temp directories (CLI lockfile generation)
tempfile = "3"

# Format-preserving TOML editing (CLI dependency management)
toml_edit = "0.25"

# LSP (CLI only)
tower-lsp = "0.20"
tokio = { version = "1", features = ["io-std", "rt-multi-thread", "macros", "time"] }

# Python stub parsing (.pyi files)
libcst = { version = "1.8", default-features = false }

# Typeshed bundling (embed stubs in binary)
include_dir = "0.7"

# Testing
insta = { version = "1.48", features = ["glob"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
