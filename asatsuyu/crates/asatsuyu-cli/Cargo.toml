[package]
name = "asatsuyu-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for the Asatsuyu compiler"

# The crate is `asatsuyu-cli`, but the command users type is `asatsuyu` — which
# is what the docs and the editor extension's default `serverPath` expect.
[[bin]]
name = "asatsuyu"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
asatsuyu-syntax = { workspace = true }
asatsuyu-lexer = { workspace = true }
asatsuyu-parser = { workspace = true }
asatsuyu-ast = { workspace = true }
asatsuyu-hir = { workspace = true }
asatsuyu-ty = { workspace = true }
asatsuyu-backend-python = { workspace = true }
clap = { workspace = true }
miette = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
pep440_rs = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
tempfile = { workspace = true }
toml_edit = { workspace = true }
smol_str = { workspace = true }
tower-lsp = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
serde_json = { workspace = true }
