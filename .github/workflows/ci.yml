name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rust-src-dir: asatsuyu
      - run: cargo fmt --all --check
        working-directory: asatsuyu

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rust-src-dir: asatsuyu
      - run: cargo clippy --workspace --all-targets
        working-directory: asatsuyu

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: asatsuyu
      - run: cargo test --workspace
        working-directory: asatsuyu

  verify-ffi:
    name: verify-ffi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: asatsuyu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFI verification tools
        run: python -m pip install --upgrade pip pyright mypy

      - name: Emit trust report
        run: cargo run -p asatsuyu-cli -- verify-ffi
        working-directory: asatsuyu

      - name: Verify typed Python surfaces
        run: |
          if [ -f scripts/verify_ffi.py ]; then
            python scripts/verify_ffi.py
          else
            echo "::warning::scripts/verify_ffi.py not found, skipping"
          fi

  # ── maturin wheel build (Linux) ──────────────────────────────────

  maturin-build:
    name: maturin build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: asatsuyu/crates/asatsuyu-runtime-python
          args: --release --out dist
          manylinux: auto

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux
          path: asatsuyu/crates/asatsuyu-runtime-python/dist/*.whl

  # ── smoke test (install wheel and import) ────────────────────────

  smoke-test:
    name: smoke import test
    needs: maturin-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wheel
        run: pip install dist/*.whl

      - name: Smoke test
        run: |
          python -c "
          import _asatsuyu_runtime
          assert _asatsuyu_runtime.ffi_available()
          print('OK: _asatsuyu_runtime loaded successfully')
          "

      - name: Run smoke test script
        run: |
          if [ -f scripts/smoke_test.py ]; then
            python scripts/smoke_test.py
          fi
