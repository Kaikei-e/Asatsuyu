name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rust-src-dir: asatsuyu
      - run: cargo fmt --all --check
        working-directory: asatsuyu

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rust-src-dir: asatsuyu
      - run: cargo clippy --workspace --all-targets
        working-directory: asatsuyu

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: asatsuyu
      - run: cargo test --workspace
        working-directory: asatsuyu

  verify-ffi:
    name: verify-ffi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: asatsuyu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFI verification tools
        run: python -m pip install --upgrade pip pyright mypy

      - name: Emit trust report
        run: cargo run -p asatsuyu-cli -- verify-ffi
        working-directory: asatsuyu

      - name: Verify typed Python surfaces
        run: python scripts/verify_ffi.py
