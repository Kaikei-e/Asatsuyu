name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust-only (no Python matrix) ────────────────────────────────

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          rust-src-dir: asatsuyu
      - run: cargo fmt --all --check
        working-directory: asatsuyu

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rust-src-dir: asatsuyu
      - run: cargo clippy --workspace --all-targets
        working-directory: asatsuyu

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: asatsuyu
      - run: cargo test --workspace
        working-directory: asatsuyu
        env:
          INSTA_UPDATE: "no"

  # ── Python-dependent (matrix: 3.12 / 3.13 / 3.14) ──────────────

  verify-ffi:
    name: verify-ffi (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: asatsuyu

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install FFI verification tools
        run: python -m pip install --upgrade pip pyright mypy

      - name: Emit trust report
        run: cargo run -p asatsuyu-cli -- verify-ffi
        working-directory: asatsuyu

      - name: Verify typed Python surfaces
        run: |
          if [ -f scripts/verify_ffi.py ]; then
            python scripts/verify_ffi.py
          else
            echo "::warning::scripts/verify_ffi.py not found, skipping"
          fi

  # ── maturin wheel build (per Python version) ────────────────────

  maturin-build:
    name: maturin build (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: asatsuyu/crates/asatsuyu-runtime-python
          command: build
          args: --release --out dist -i python${{ matrix.python }}
          manylinux: "2014"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.python }}
          path: asatsuyu/crates/asatsuyu-runtime-python/dist/*.whl

  # ── pytest (install wheel + run full test suite) ────────────────

  pytest:
    name: pytest (${{ matrix.python }})
    needs: maturin-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-${{ matrix.python }}
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install wheel and test deps
        run: |
          pip install dist/*.whl
          pip install pytest

      - name: Run pytest
        run: pytest tests/ -v --tb=short

      - name: Run smoke test script
        run: |
          if [ -f scripts/smoke_test.py ]; then
            python scripts/smoke_test.py
          fi

  # ── package install (build .asty → install → import) ────────────

  package-install:
    name: package install (${{ matrix.python }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: asatsuyu

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build and install generated packages
        run: python scripts/test_package_install.py

  # ── docs sync check ─────────────────────────────────────────────────

  docs-sync:
    name: docs sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs_sync.py

  # ── release gate (aggregates ALL gates) ─────────────────────────────

  release-gate:
    name: release gate
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - verify-ffi
      - maturin-build
      - pytest
      - package-install
      - docs-sync
    runs-on: ubuntu-latest
    steps:
      - name: Check all gates passed
        run: |
          echo "Gate results:"
          echo "  fmt:             ${{ needs.fmt.result }}"
          echo "  clippy:          ${{ needs.clippy.result }}"
          echo "  test:            ${{ needs.test.result }}"
          echo "  verify-ffi:      ${{ needs.verify-ffi.result }}"
          echo "  maturin-build:   ${{ needs.maturin-build.result }}"
          echo "  pytest:          ${{ needs.pytest.result }}"
          echo "  package-install: ${{ needs.package-install.result }}"
          echo "  docs-sync:       ${{ needs.docs-sync.result }}"
          if [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.verify-ffi.result }}" != "success" ]] || \
             [[ "${{ needs.maturin-build.result }}" != "success" ]] || \
             [[ "${{ needs.pytest.result }}" != "success" ]] || \
             [[ "${{ needs.package-install.result }}" != "success" ]] || \
             [[ "${{ needs.docs-sync.result }}" != "success" ]]; then
            echo ""
            echo "RELEASE GATE: FAIL — one or more gates did not pass"
            exit 1
          fi
          echo ""
          echo "RELEASE GATE: PASS — all gates green"
